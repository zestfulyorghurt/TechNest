<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人技术社区全功能原型</title>
<style>
  :root {
    --bg: #f4f7f5;
    --surface: #ffffff;
    --surface-soft: #f8fbfa;
    --surface-strong: #eaf3ef;
    --text: #1f2a2e;
    --muted: #657773;
    --line: #d9e3df;
    --line-strong: #c7d4cf;
    --primary: #247b63;
    --primary-dark: #155c4a;
    --primary-soft: #e3f2ed;
    --blue: #3978c3;
    --blue-soft: #e6f0fb;
    --coral: #e9654f;
    --coral-soft: #fcebe7;
    --amber: #c98318;
    --amber-soft: #fff3d8;
    --purple: #7963b5;
    --purple-soft: #eeeafb;
    --sidebar: #142421;
    --sidebar-soft: #243a35;
    --shadow: 0 18px 42px rgba(35, 51, 46, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  .icon-sprite {
    display: none;
  }

  .app-shell {
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    min-height: 100vh;
  }

  .sidebar {
    position: sticky;
    top: 0;
    display: flex;
    height: 100vh;
    flex-direction: column;
    gap: 20px;
    overflow: auto;
    padding: 22px;
    background: var(--sidebar);
    color: #eef8f4;
  }

  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    min-width: 0;
  }

  .brand-mark {
    display: grid;
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    place-items: center;
    border-radius: 8px;
    background: #65caa6;
    color: #0e211d;
    font-weight: 700;
  }

  .brand strong,
  .user-card strong {
    display: block;
    font-weight: 600;
  }

  .brand span,
  .user-card span,
  .nav-group-title {
    color: #adc5bd;
    font-size: 13px;
  }

  .nav-groups {
    display: grid;
    gap: 16px;
  }

  .nav-group {
    display: grid;
    gap: 7px;
  }

  .nav-group-title {
    margin: 0 0 2px;
    padding-left: 8px;
  }

  .nav-button {
    display: flex;
    width: 100%;
    min-height: 42px;
    align-items: center;
    gap: 10px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #dcece7;
    text-align: left;
  }

  .nav-button:hover,
  .nav-button.active {
    background: var(--sidebar-soft);
    color: #fff;
  }

  .nav-button span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .nav-button em {
    margin-left: auto;
    min-width: 22px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    font-size: 12px;
    font-style: normal;
    text-align: center;
  }

  .user-card {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.13);
  }

  .avatar {
    display: grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-weight: 700;
  }

  .avatar.small {
    width: 34px;
    height: 34px;
    font-size: 13px;
  }

  .main {
    min-width: 0;
    padding: 26px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 22px;
  }

  .kicker {
    margin: 0 0 5px;
    color: var(--muted);
    font-size: 13px;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  h1 {
    margin-bottom: 0;
    font-size: 30px;
    letter-spacing: 0;
  }

  h2 {
    margin-bottom: 8px;
    font-size: 22px;
    letter-spacing: 0;
  }

  h3 {
    margin-bottom: 0;
    font-size: 16px;
    letter-spacing: 0;
  }

  .top-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .role-switch {
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  .role-switch button,
  .tab-row button,
  .chip,
  .icon-btn,
  .primary-btn,
  .secondary-btn,
  .ghost-btn,
  .danger-btn {
    min-height: 38px;
    border-radius: 8px;
  }

  .role-switch button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 0 10px;
  }

  .role-switch button.active {
    background: var(--primary);
    color: #fff;
  }

  .icon-btn {
    position: relative;
    display: inline-grid;
    width: 40px;
    place-items: center;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }

  .badge-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    font-size: 11px;
    line-height: 16px;
    text-align: center;
  }

  .primary-btn,
  .secondary-btn,
  .ghost-btn,
  .danger-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    border: 0;
    white-space: nowrap;
  }

  .primary-btn {
    background: var(--primary);
    color: #fff;
    font-weight: 600;
  }

  .primary-btn:hover {
    background: var(--primary-dark);
  }

  .secondary-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }

  .ghost-btn {
    background: transparent;
    color: var(--primary-dark);
  }

  .danger-btn {
    border: 1px solid #f0b8ad;
    background: var(--coral-soft);
    color: #a83827;
  }

  .content {
    display: grid;
    gap: 20px;
  }

  .panel,
  .metric-card,
  .article-card,
  .table-panel,
  .empty-state,
  .auth-panel,
  .editor-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .panel,
  .table-panel,
  .editor-card {
    padding: 20px;
  }

  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .panel-title span,
  .muted {
    color: var(--muted);
    font-size: 13px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .grid-main-side {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 18px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .metric-card {
    padding: 16px;
  }

  .metric-card span {
    display: block;
    color: var(--muted);
    font-size: 13px;
  }

  .metric-card strong {
    display: block;
    margin: 8px 0 6px;
    font-size: 27px;
  }

  .metric-card em {
    color: var(--primary);
    font-size: 13px;
    font-style: normal;
  }

  .hero-workbench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 18px;
    align-items: stretch;
  }

  .feature-article {
    overflow: hidden;
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .feature-cover {
    display: flex;
    min-height: 230px;
    align-items: flex-end;
    padding: 24px;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
      linear-gradient(180deg, rgba(255, 255, 255, 0.10) 1px, transparent 1px),
      linear-gradient(135deg, #1c3e38, #2f6e63 54%, #d4a44a);
    background-size: 32px 32px, 32px 32px, auto;
    color: #fff;
  }

  .feature-cover h2 {
    max-width: 720px;
    margin-bottom: 8px;
    font-size: 28px;
  }

  .feature-body {
    display: grid;
    gap: 14px;
    padding: 18px;
  }

  .quick-stack {
    display: grid;
    gap: 12px;
  }

  .quick-card {
    display: grid;
    min-height: 118px;
    align-content: space-between;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  .quick-card strong {
    display: block;
    margin-bottom: 6px;
  }

  .quick-card p {
    margin-bottom: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .tag,
  .status,
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
  }

  .tag {
    padding: 4px 9px;
    background: var(--surface-strong);
    color: var(--primary-dark);
  }

  .status {
    padding: 4px 9px;
    background: var(--blue-soft);
    color: #245d9e;
  }

  .status.warn {
    background: var(--amber-soft);
    color: #875800;
  }

  .status.danger {
    background: var(--coral-soft);
    color: #a83827;
  }

  .status.ok {
    background: var(--primary-soft);
    color: var(--primary-dark);
  }

  .article-list {
    display: grid;
    gap: 12px;
  }

  .article-card {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    gap: 14px;
    padding: 14px;
  }

  .thumb {
    min-height: 104px;
    border-radius: 8px;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px),
      linear-gradient(180deg, rgba(255, 255, 255, 0.11) 1px, transparent 1px),
      linear-gradient(135deg, #1c3e38, #2f6e63 54%, #d4a44a);
    background-size: 22px 22px, 22px 22px, auto;
  }

  .article-card h3 {
    margin-bottom: 6px;
  }

  .article-card p {
    margin-bottom: 12px;
    color: var(--muted);
    line-height: 1.7;
  }

  .meta-line {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .toolbar,
  .form-row,
  .comment-actions,
  .composer,
  .review-actions,
  .inline-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .toolbar {
    justify-content: space-between;
  }

  .search-box {
    position: relative;
    flex: 1 1 320px;
  }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    color: var(--muted);
    transform: translateY(-50%);
  }

  .search-box input {
    width: 100%;
    min-height: 42px;
    padding: 0 12px 0 40px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }

  .chip.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-dark);
  }

  .tab-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tab-row button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    padding: 0 12px;
  }

  .tab-row button.active {
    border-color: var(--primary);
    background: var(--primary);
    color: #fff;
  }

  .detail-body {
    display: grid;
    gap: 18px;
  }

  .article-detail {
    padding: 24px;
  }

  .article-detail h2 {
    font-size: 30px;
  }

  .article-content {
    color: #2d3c38;
    line-height: 1.9;
  }

  .article-content h3 {
    margin-top: 20px;
    margin-bottom: 8px;
  }

  .interaction-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .action-metric {
    display: flex;
    min-height: 44px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-soft);
    color: var(--text);
  }

  .action-metric.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-dark);
  }

  .author-panel {
    display: grid;
    gap: 14px;
  }

  .author-head {
    display: grid;
    grid-template-columns: 54px minmax(0, 1fr);
    gap: 12px;
    align-items: center;
  }

  .author-head .avatar {
    width: 54px;
    height: 54px;
  }

  .comment-list,
  .notice-list,
  .activity-list,
  .draft-list,
  .log-list {
    display: grid;
    gap: 12px;
  }

  .comment-item,
  .notice-item,
  .activity-item,
  .draft-item,
  .log-item {
    display: grid;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-soft);
  }

  .comment-main {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 10px;
  }

  .comment-item p,
  .notice-item p,
  .activity-item p,
  .draft-item p {
    margin-bottom: 0;
    color: var(--muted);
    line-height: 1.6;
  }

  textarea,
  input,
  select {
    color: var(--text);
  }

  textarea,
  .field input,
  .field select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  textarea {
    padding: 12px;
    resize: vertical;
  }

  .field {
    display: grid;
    gap: 7px;
  }

  .field label {
    color: var(--text);
    font-weight: 600;
  }

  .field input,
  .field select {
    min-height: 42px;
    padding: 0 12px;
  }

  .auth-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .auth-panel {
    display: grid;
    gap: 14px;
    padding: 22px;
  }

  .form-grid {
    display: grid;
    gap: 12px;
  }

  .profile-head {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
  }

  .profile-head .avatar {
    width: 76px;
    height: 76px;
    font-size: 24px;
  }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 680px;
  }

  th,
  td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
  }

  th {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  td {
    color: var(--text);
  }

  .editor-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 18px;
  }

  .upload-box {
    display: grid;
    min-height: 150px;
    place-items: center;
    padding: 18px;
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    background:
      linear-gradient(135deg, rgba(36, 123, 99, 0.08), rgba(57, 120, 195, 0.08)),
      var(--surface-soft);
    text-align: center;
  }

  .upload-box strong {
    display: block;
    margin-bottom: 5px;
  }

  .status-flow {
    display: grid;
    gap: 10px;
  }

  .flow-step {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
  }

  .flow-step i {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-style: normal;
    font-size: 13px;
  }

  .flow-step.pending i {
    background: var(--amber);
  }

  .flow-step.muted-step i {
    background: #9aaba6;
  }

  .message-layout {
    display: grid;
    grid-template-columns: 310px minmax(0, 1fr);
    gap: 18px;
  }

  .conversation-list {
    display: grid;
    align-content: start;
    gap: 8px;
  }

  .conversation {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    text-align: left;
  }

  .conversation.active,
  .conversation:hover {
    background: var(--primary-soft);
  }

  .conversation strong,
  .conversation em {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conversation em {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    font-style: normal;
  }

  .chat-panel {
    display: grid;
    min-height: 560px;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
  }

  .chat-head,
  .composer {
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  .composer {
    border-top: 1px solid var(--line);
    border-bottom: 0;
  }

  .chat-stream {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
  }

  .bubble {
    max-width: min(540px, 88%);
    margin: 0;
    padding: 11px 13px;
    border-radius: 8px;
    line-height: 1.7;
  }

  .bubble.other {
    align-self: flex-start;
    background: var(--surface-soft);
  }

  .bubble.mine {
    align-self: flex-end;
    background: var(--primary);
    color: #fff;
  }

  .composer input {
    flex: 1 1 260px;
    min-height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(290px, 0.7fr);
    gap: 18px;
  }

  .line-chart {
    width: 100%;
    height: auto;
    color: var(--primary);
  }

  .line-chart polyline {
    fill: none;
    stroke: currentColor;
    stroke-width: 4;
  }

  .line-chart .grid-line {
    color: var(--line);
    stroke: currentColor;
    stroke-width: 1;
  }

  .bar-chart {
    display: grid;
    height: 240px;
    grid-template-columns: repeat(7, minmax(18px, 1fr));
    align-items: end;
    gap: 12px;
    padding-top: 20px;
    border-bottom: 1px solid var(--line);
  }

  .bar-chart span {
    height: var(--h);
    min-height: 22px;
    border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, #6db5d8, var(--blue));
  }

  .rank-list {
    display: grid;
    gap: 13px;
  }

  .rank-item {
    display: grid;
    gap: 7px;
  }

  .rank-item header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .rank-item span {
    color: var(--muted);
    font-size: 13px;
  }

  .rank-bar {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-strong);
    overflow: hidden;
  }

  .rank-bar i {
    display: block;
    width: var(--w);
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--primary), #6db5d8);
  }

  .donut-wrap {
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr);
    gap: 18px;
    align-items: center;
  }

  .donut {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: conic-gradient(var(--primary) 0 52%, var(--blue) 52% 80%, var(--coral) 80% 100%);
    position: relative;
  }

  .donut::after {
    content: "";
    position: absolute;
    inset: 34px;
    border-radius: 50%;
    background: var(--surface);
  }

  .legend {
    display: grid;
    gap: 9px;
  }

  .legend span {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .legend i {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .swatch-primary {
    background: var(--primary);
  }

  .swatch-blue {
    background: var(--blue);
  }

  .swatch-coral {
    background: var(--coral);
  }

  .empty-state {
    display: grid;
    min-height: 220px;
    place-items: center;
    padding: 24px;
    text-align: center;
  }

  .empty-state svg {
    width: 40px;
    height: 40px;
    margin-bottom: 10px;
    color: var(--muted);
  }

  .lock-panel {
    display: grid;
    min-height: 360px;
    place-items: center;
    padding: 28px;
    text-align: center;
  }

  .lock-panel svg {
    width: 44px;
    height: 44px;
    margin-bottom: 14px;
    color: var(--amber);
  }

  .check-list {
    display: grid;
    gap: 10px;
  }

  .check-item {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-soft);
  }

  .check-item i {
    display: grid;
    width: 22px;
    height: 22px;
    place-items: center;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-style: normal;
  }

  .code-block {
    overflow-x: auto;
    padding: 14px;
    border-radius: 8px;
    background: #182522;
    color: #e5fff5;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.7;
  }

  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    display: none;
    max-width: min(360px, calc(100vw - 40px));
    padding: 12px 14px;
    border-radius: 8px;
    background: #182522;
    color: #fff;
    box-shadow: var(--shadow);
  }

  .toast.show {
    display: block;
  }

  @media (max-width: 1180px) {
    .app-shell {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: static;
      height: auto;
      padding: 16px;
    }

    .brand,
    .user-card {
      display: none;
    }

    .nav-groups {
      display: block;
    }

    .nav-group {
      display: flex;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .nav-group + .nav-group {
      margin-top: 8px;
    }

    .nav-group-title {
      display: none;
    }

    .nav-button {
      width: auto;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .main {
      padding: 20px;
    }

    .grid-main-side,
    .hero-workbench,
    .editor-layout,
    .message-layout,
    .chart-grid {
      grid-template-columns: 1fr;
    }

    .metric-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 720px) {
    .main {
      padding: 16px;
    }

    .topbar,
    .toolbar,
    .profile-head,
    .panel-title {
      align-items: stretch;
      flex-direction: column;
    }

    .topbar {
      display: flex;
    }

    .profile-head {
      grid-template-columns: 1fr;
    }

    h1 {
      font-size: 24px;
    }

    .top-actions,
    .role-switch,
    .inline-actions,
    .comment-actions {
      width: 100%;
    }

    .role-switch,
    .top-actions {
      justify-content: stretch;
    }

    .role-switch button,
    .top-actions > button,
    .primary-btn,
    .secondary-btn,
    .danger-btn {
      flex: 1 1 auto;
    }

    .grid-2,
    .grid-3,
    .metric-grid,
    .auth-grid,
    .interaction-row {
      grid-template-columns: 1fr;
    }

    .article-card {
      grid-template-columns: 1fr;
    }

    .thumb {
      min-height: 150px;
    }

    .feature-cover {
      min-height: 180px;
    }

    .feature-cover h2,
    .article-detail h2 {
      font-size: 24px;
    }

    .donut-wrap {
      grid-template-columns: 1fr;
      justify-items: center;
    }
  }
</style>
</head>

  const roleInfo = {

  const articles = [
    { title: "从博客项目开始打通 Web 开发链路", category: "React", tag: "实战", author: "林木", views: 2846, likes: 128, comments: 18, status: "已发布", summary: "从需求定义、原型设计、接口联调到部署上线的一次完整实践。" },

  const content = document.getElementById("content");

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",

      '"': "&quot;",
      "'": "&#039;"

  function toast(message) {
    const node = document.getElementById("toast");

    if (state.adminTab === "reviews") {
      return table("文章审核", ["文章", "作者", "状态", "提交时间", "操作"], [
        ["JWT 登录态和前端路由守卫实践", "陈同学", '<span class="status warn">待审核</span>', "今天 10:20", '<div class="review-actions"><button class="primary-btn" type="button" data-action="approve">通过</button><button class="danger-btn" type="button" data-action="reject">驳回</button></div>'],
        ["数据看板接口设计", "赵同学", '<span class="status warn">待审核</span>', "昨天 19:16", '<div class="review-actions"><button class="primary-btn" type="button" data-action="approve">通过</button><button class="danger-btn" type="button" data-action="reject">驳回</button></div>']
      ]);
    }
    if (state.adminTab === "comments") {
      return table("评论管理", ["评论内容", "用户", "文章", "状态", "操作"], [
        ["这个设计可以直接拿去建表。", "陈同学", "评论系统设计拆解", '<span class="status ok">正常</span>', '<button class="ghost-btn" type="button">删除</button>'],
        ["带有敏感词的测试评论", "测试账号", "JWT 登录实践", '<span class="status danger">隐藏</span>', '<button class="ghost-btn" type="button">恢复</button>']
      ]);
    }
    if (state.adminTab === "categories") {
      return table("分类标签管理", ["类型", "名称", "文章数", "排序", "操作"], [
        ["分类", "React", "126", "1", '<button class="ghost-btn" type="button">编辑</button>'],
        ["分类", "数据库", "84", "2", '<button class="ghost-btn" type="button">编辑</button>'],
        ["标签", "实战", "232", "-", '<button class="ghost-btn" type="button">合并</button>']
      ]);
    }
    return `
      <div class="panel-title"><h3>系统日志</h3><span>admin_logs</span></div>
      <div class="log-list">
        ${log("管理员通过文章审核", "article_id=1038，审核人=admin，结果=approved")}
        ${log("用户登录失败触发限流", "ip=127.0.0.1，reason=password_error")}
        ${log("上传文件被拦截", "file=demo.exe，reason=invalid_extension")}
      </div>
    `;
  }

  function renderSystem() {
    return `
      <section class="grid-2">
        <div class="panel">
          <div class="panel-title">
            <h3>文件资源模块</h3>
            <span>upload</span>
          </div>
          <button class="upload-box" type="button" data-action="upload">
            <span>
              ${icon("i-upload")}
              <strong>上传头像 / 封面 / Markdown 图片</strong>
              <span class="muted">格式校验、大小限制、文件名安全处理</span>
            </span>
          </button>
          <div class="table-wrap" style="margin-top:14px">
            <table>
              <thead><tr><th>资源</th><th>格式</th><th>大小</th><th>用途</th></tr></thead>
              <tbody>
                <tr><td>头像</td><td>jpg/png/webp</td><td>小于 1MB</td><td>个人资料</td></tr>
                <tr><td>文章封面</td><td>jpg/png/webp</td><td>小于 2MB</td><td>文章卡片</td></tr>
                <tr><td>正文图片</td><td>jpg/png/webp/gif</td><td>小于 5MB</td><td>Markdown 内容</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">
            <h3>系统安全模块</h3>
            <span>security</span>
          </div>
          <div class="check-list">
            ${check("密码加密", "password_hash，不保存明文密码", "P0")}
            ${check("接口鉴权", "写操作校验 token 和角色", "P0")}
            ${check("XSS 防护", "Markdown 和评论内容安全过滤", "P0")}
            ${check("接口限流", "登录、评论、上传限制频率", "P1")}
            ${check("日志审计", "管理员操作和异常事件留痕", "P1")}
          </div>
        </div>
      </section>

      <section class="grid-2">
        <div class="panel">
          <div class="panel-title"><h3>统一 API 响应</h3><span>response</span></div>
          <pre class="code-block">{
  "code": 0,
  "message": "success",
  "data": {
    "list": [],
    "page": 1,
    "pageSize": 10,
    "total": 100
  }
}</pre>
        </div>
        <div class="panel">
          <div class="panel-title"><h3>上线检查</h3><span>deploy</span></div>
          <div class="check-list">
            ${check("环境变量", "数据库、JWT 密钥、上传路径配置完成", "通过")}
            ${check("HTTPS", "生产环境证书和反向代理可用", "通过")}
            ${check("数据库备份", "上线前准备备份策略", "待确认")}
            ${check("冒烟测试", "登录、发文、互动、后台审核", "待执行")}
          </div>
        </div>
      </section>
    `;
  }

  function metric(label, value, extra) {
    return `<div class="metric-card"><span>${label}</span><strong>${value}</strong><em>${extra}</em></div>`;
  }

  function check(title, detail, status) {
    return `<div class="check-item"><i>✓</i><div><strong>${title}</strong><p class="muted">${detail}</p></div><span class="status">${status}</span></div>`;
  }

  function articleCard(item) {
    return `
      <article class="article-card">
        <div class="thumb" aria-hidden="true"></div>
        <div>
          <div class="meta-line"><span class="tag">${item.category}</span><span class="status ${item.status === "审核中" ? "warn" : "ok"}">${item.status}</span></div>
          <h3>${item.title}</h3>
          <p>${item.summary}</p>
          <div class="meta-line">
            <span>作者：${item.author}</span>
            <span>阅读 ${item.views}</span>
            <span>点赞 ${item.likes}</span>
            <span>评论 ${item.comments}</span>
          </div>
        </div>
      </article>
    `;
  }

  function actionMetric(action, iconId, label, count, active) {
    return `<button class="action-metric ${active ? "active" : ""}" type="button" data-action="${action}">${icon(iconId)}<span>${label}</span><strong>${count}</strong></button>`;
  }

  function commentTemplate(item) {
    return `
      <div class="comment-item">
        <div class="comment-main">
          <div class="avatar small">${item.avatar}</div>
          <div>
            <strong>${item.name}</strong>
            <p>${escapeHtml(item.text)}</p>
            <span class="muted">${item.time}</span>
          </div>
        </div>
        <div class="inline-actions">
          <button class="ghost-btn" type="button">回复</button>
          <button class="ghost-btn" type="button">删除</button>
        </div>
      </div>
    `;
  }

  function empty(iconId, title, detail) {
    return `<div class="empty-state">${icon(iconId)}<div><h3>${title}</h3><p class="muted">${detail}</p></div></div>`;
  }

  function activity(name, detail, action) {
    return `<div class="activity-item"><strong>${name}</strong><p>${detail}</p><div><button class="secondary-btn" type="button">${action}</button></div></div>`;
  }

  function flow(index, title, detail, className) {
    return `<div class="flow-step ${className}"><i>${index}</i><div><strong>${title}</strong><p class="muted">${detail}</p></div></div>`;
  }

  function draft(title, time, action) {
    return `<div class="draft-item"><strong>${title}</strong><p>${time}</p><div><button class="secondary-btn" type="button">${action}</button></div></div>`;
  }

  function notice(title, detail, status, type) {
    return `<div class="notice-item"><div class="panel-title" style="margin-bottom:0"><strong>${title}</strong><span class="status ${type}">${status}</span></div><p>${detail}</p></div>`;
  }

  function lineChart(points) {
    return `
      <svg class="line-chart" viewBox="0 0 680 260" role="img" aria-label="趋势折线图">
        <line class="grid-line" x1="30" x2="650" y1="220" y2="220"></line>
        <line class="grid-line" x1="30" x2="650" y1="150" y2="150"></line>
        <line class="grid-line" x1="30" x2="650" y1="80" y2="80"></line>
        <polyline points="${points}"></polyline>
      </svg>
    `;
  }

  function rank(title, value, width) {
    return `<div class="rank-item"><header><strong>${title}</strong><span>${value}</span></header><div class="rank-bar"><i style="--w:${width}"></i></div></div>`;
  }

  function table(title, heads, rows) {
    return `
      <div class="panel-title"><h3>${title}</h3><span>管理操作</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr>${heads.map((head) => `<th>${head}</th>`).join("")}</tr></thead>
          <tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>
    `;
  }

  function adminTabName(tab) {
    return { users: "用户管理", reviews: "文章审核", comments: "评论管理", categories: "分类标签", logs: "系统日志" }[tab];
  }

  function log(title, detail) {
    return `<div class="log-item"><strong>${title}</strong><p class="muted">${detail}</p></div>`;
  }

  const renderers = {
    home: renderHome,
    discover: renderDiscover,
    article: renderArticle,
    auth: renderAuth,
    profile: renderProfile,
    creator: renderCreator,
    messages: renderMessages,
    analytics: renderAnalytics,
    admin: renderAdmin,
    system: renderSystem
  };

  function render() {
    const [kicker, title] = routeMeta[state.route];
    document.getElementById("page-kicker").textContent = kicker;
    document.getElementById("page-title").textContent = title;
    document.querySelectorAll("[data-route]").forEach((button) => {
      button.classList.toggle("active", button.dataset.route === state.route);
    });
    document.querySelectorAll("[data-role]").forEach((button) => {
      button.classList.toggle("active", button.dataset.role === state.role);
    });
    const [name, role, avatar] = roleInfo[state.role];
    document.getElementById("sidebar-user").textContent = name;
    document.getElementById("sidebar-role").textContent = role;
    document.getElementById("sidebar-avatar").textContent = avatar;
    document.getElementById("nav-unread").textContent = state.unread;
    document.getElementById("top-unread").textContent = state.unread;
    content.innerHTML = renderers[state.route]();
  }

  document.body.addEventListener("click", (event) => {
    const routeButton = event.target.closest("[data-route]");
    if (routeButton) {
      const targetRoute = routeButton.dataset.route;
      if (routeButton.dataset.action === "role-admin") {
        state.role = "admin";
      }
      state.route = targetRoute;
      render();
      return;
    }

    const roleButton = event.target.closest("[data-role]");
    if (roleButton) {
      state.role = roleButton.dataset.role;
      render();
      toast(`已切换为${roleInfo[state.role][1]}`);
      return;
    }

    const categoryButton = event.target.closest("[data-category]");
    if (categoryButton) {
      state.category = categoryButton.dataset.category;
      render();
      return;
    }

    const analyticsButton = event.target.closest("[data-analytics]");
    if (analyticsButton) {
      state.analyticsMode = analyticsButton.dataset.analytics;
      render();
      return;
    }

    const adminButton = event.target.closest("[data-admin-tab]");
    if (adminButton) {
      state.adminTab = adminButton.dataset.adminTab;
      render();
      return;
    }

    const actionButton = event.target.closest("[data-action]");
    if (!actionButton) return;
    const action = actionButton.dataset.action;

    if (action === "role-user") {
      state.role = "user";
      render();
      toast("已模拟登录为普通用户");
      return;
    }
    if (action === "role-admin") {
      state.role = "admin";
      render();
      toast("已模拟切换为管理员");
      return;
    }
    if (action === "login" || action === "register") {
      state.role = "user";
      state.route = "home";
      render();
      toast(action === "login" ? "登录成功" : "注册成功");
      return;
    }
    if (["like", "favorite", "follow", "post-comment", "send-message"].includes(action) && !canUseAuthFeature()) {
      state.route = "auth";
      render();
      toast("请先登录后再操作");
      return;
    }
    if (action === "like") {
      state.liked = !state.liked;
      render();
      toast(state.liked ? "已点赞，行为已写入 user_events" : "已取消点赞");
      return;
    }
    if (action === "favorite") {
      state.favorited = !state.favorited;
      render();
      toast(state.favorited ? "已收藏，可在个人中心查看" : "已取消收藏");
      return;
    }
    if (action === "follow") {
      state.followed = !state.followed;
      render();
      toast(state.followed ? "已关注作者" : "已取消关注");
      return;
    }
    if (action === "focus-comment") {
      const input = document.getElementById("comment-input");
      if (input) input.focus();
      return;
    }
    if (action === "post-comment") {
      const input = document.getElementById("comment-input");
      const text = input ? input.value.trim() : "";
      if (!text) {
        toast("评论内容不能为空");
        return;
      }
      state.comments.unshift({ name: "赵同学", avatar: "赵", text, time: "刚刚" });
      render();
      toast("评论已发送，通知已生成");
      return;
    }
    if (action === "send-message") {
      const input = document.getElementById("message-input");
      const text = input ? input.value.trim() : "";
      if (!text) {
        toast("请输入私信内容");
        return;
      }
      state.messages.push({ mine: true, text });
      render();
      toast("私信已发送");
      return;
    }
    if (action === "read-all") {
      state.unread = 0;
      render();
      toast("通知已全部标记为已读");
      return;
    }
    if (action === "save-draft") {
      toast("草稿已保存");
      return;
    }
    if (action === "publish-article") {
      toast("文章已提交审核");
      return;
    }
    if (action === "upload") {
      toast("文件已通过格式和大小校验");
      return;
    }
    if (action === "save-profile") {
      toast("个人资料已保存");
      return;
    }
    if (action === "approve") {
      toast("文章审核已通过");
      return;
    }
    if (action === "reject") {
      toast("文章已驳回并生成通知");
    }
  });

  document.body.addEventListener("input", (event) => {
    if (event.target.id === "search-input") {
      state.query = event.target.value.trim();
      render();
      const input = document.getElementById("search-input");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  });

  render();
</script>
</body>
</html>
