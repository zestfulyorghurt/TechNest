<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSDN 文章编辑发布页原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f7f9;
            --panel: #ffffff;
            --text: #1a2a3a;
            --text-soft: #4a5a6a;
            --muted: #8a9aaa;
            --placeholder: #b4bdc8;
            --line: #e8edf4;
            --line-strong: #d5dfdc;
            --soft: #f8f9fa;
            --primary: #4f6ef7;
            --primary-dark: #3b5de7;
            --brand: #fc5531;
            --brand-dark: #e74420;
            --green: #247b63;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 16px 40px rgba(26, 42, 58, 0.10);
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 128px 24px 96px;
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .icon-sprite {
            display: none;
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .icon-sm {
            width: 16px;
            height: 16px;
        }

        .topbar {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 30;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--panel);
            border-bottom: 1px solid #eef2f6;
        }

        .topbar__left,
        .topbar__right,
        .page-title,
        .sync-pill,
        .notice-link {
            display: flex;
            align-items: center;
        }

        .topbar__left {
            gap: 24px;
            min-width: 0;
        }

        .logo {
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0;
            color: #3d3f46;
            white-space: nowrap;
            transform: skew(-8deg);
        }

        .logo::first-letter {
            color: var(--brand);
        }

        .page-title {
            gap: 12px;
            color: #111827;
            font-size: 22px;
            white-space: nowrap;
        }

        .page-title__back {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #111827;
        }

        .page-title__caret {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 8px solid #111827;
            margin-left: 2px;
        }

        .topbar__right {
            gap: 24px;
            color: #1f2937;
        }

        .sync-pill {
            gap: 6px;
            height: 38px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
            color: #111827;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .sync-pill__mark {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 28%, #ffe4c8 0 10%, transparent 11%),
                linear-gradient(145deg, #2d3748 0 44%, #6b8fb8 45% 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        .notice-link {
            position: relative;
            gap: 2px;
            color: #111827;
            font-size: 16px;
        }

        .notice-link::after {
            content: "";
            position: absolute;
            top: 2px;
            right: -8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--brand);
        }

        .toolbar {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            z-index: 29;
            height: 68px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(26, 42, 58, 0.02);
        }

        .toolbar__scroll {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            max-width: 1660px;
            padding: 0 32px;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tool-btn {
            width: 48px;
            height: 56px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #5a5d6e;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 14px;
            white-space: nowrap;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .tool-btn:hover,
        .tool-btn.is-active {
            color: var(--primary);
            background: #f1f5ff;
        }

        .tool-btn__label {
            display: block;
            line-height: 18px;
        }

        .tool-separator {
            width: 1px;
            height: 32px;
            background: var(--line);
            margin: 0 8px;
            flex-shrink: 0;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(260px, 350px) minmax(620px, 1020px) minmax(112px, 130px);
            gap: 60px;
            align-items: start;
            max-width: 1848px;
            margin: 38px auto 0;
        }

        .catalog-panel {
            position: sticky;
            top: 166px;
            min-height: calc(100vh - 236px);
            background: var(--panel);
            border-radius: 6px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .catalog-panel__header {
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--line);
            color: #222631;
            font-size: 16px;
            font-weight: 500;
        }

        .catalog-panel__collapse {
            width: 32px;
            height: 32px;
            border: 0;
            background: transparent;
            color: #111827;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .catalog-panel__body {
            padding: 24px 22px;
        }

        .outline-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: var(--text-soft);
            font-size: 14px;
        }

        .outline-item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 28px;
            padding: 5px 8px;
            border-radius: 6px;
            color: #4a5a6a;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .outline-item:hover {
            background: var(--soft);
            color: var(--primary);
        }

        .outline-item::before {
            content: "";
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.55;
        }

        .outline-item.level-3 {
            margin-left: 18px;
            color: #6b7a8a;
        }

        .outline-empty {
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #3d4658;
            font-size: 15px;
            line-height: 1.8;
        }

        .editor-area {
            min-width: 0;
        }

        .editor-paper {
            min-height: calc(100vh - 198px);
            background: var(--panel);
            border-radius: 6px;
            box-shadow: var(--shadow);
            padding: 40px 80px 84px;
        }

        .title-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 24px;
            align-items: start;
            min-height: 70px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 22px;
        }

        .article-title {
            min-height: 44px;
            color: #1d2939;
            font-size: 28px;
            line-height: 44px;
            font-weight: 700;
            outline: none;
            word-break: break-word;
        }

        .article-title:empty::before {
            content: attr(data-placeholder);
            color: #a8b2c1;
        }

        .title-helper {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 2px;
            color: #111827;
            font-size: 14px;
            white-space: nowrap;
        }

        .magic-btn {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 8px;
            background: #f3f5f8;
            color: #303646;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .magic-btn:hover {
            background: #eef3ff;
            color: var(--primary);
        }

        .title-helper__text.is-ready {
            color: var(--green);
        }

        .title-helper__text.is-warning {
            color: var(--brand);
        }

        .editor-body-wrap {
            position: relative;
            min-height: 520px;
            padding-top: 34px;
        }

        .article-editor {
            position: relative;
            z-index: 2;
            min-height: 520px;
            outline: none;
            color: #243142;
            font-size: 17px;
            line-height: 1.9;
            word-break: break-word;
        }

        .article-editor h2 {
            margin: 28px 0 12px;
            color: #182233;
            font-size: 24px;
            line-height: 1.45;
        }

        .article-editor h3 {
            margin: 22px 0 10px;
            color: #1f2a3a;
            font-size: 19px;
            line-height: 1.45;
        }

        .article-editor p {
            margin-bottom: 14px;
        }

        .article-editor blockquote {
            margin: 16px 0;
            padding: 10px 14px;
            border-left: 4px solid var(--primary);
            background: #f5f7ff;
            color: #4a5a6a;
            border-radius: 4px;
        }

        .article-editor pre {
            margin: 16px 0;
            padding: 16px;
            border-radius: 8px;
            background: #1e2a3a;
            color: #e8edf4;
            overflow-x: auto;
            line-height: 1.65;
            font-size: 14px;
        }

        .editor-hints {
            position: absolute;
            z-index: 1;
            top: 34px;
            left: 0;
            right: 0;
            pointer-events: none;
            color: #b7bdc6;
            font-size: 20px;
            line-height: 2;
        }

        .editor-hints.is-hidden {
            display: none;
        }

        .editor-hints strong {
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .ai-panel {
            position: sticky;
            top: 170px;
            width: 130px;
            background: var(--panel);
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .ai-panel__header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 54px;
            border-bottom: 1px solid #f1f3f6;
            color: #222631;
            font-weight: 700;
            white-space: nowrap;
        }

        .ai-panel__mark {
            width: 25px;
            height: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            color: #fff;
            background: linear-gradient(135deg, #a879ff, #6f8cff);
            font-size: 13px;
            font-weight: 800;
        }

        .ai-panel__body {
            padding: 10px 0;
        }

        .ai-action {
            width: 100%;
            height: 46px;
            border: 0;
            background: #fff;
            color: #222631;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .ai-action:hover {
            background: #f6f8ff;
            color: var(--primary);
        }

        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 32;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border-top: 1px solid var(--line);
            box-shadow: 0 -2px 8px rgba(26, 42, 58, 0.03);
        }

        .bottom-bar__inner {
            width: min(1100px, calc(100vw - 48px));
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .word-count {
            color: #111827;
            font-size: 16px;
            white-space: nowrap;
        }

        .publish-settings {
            position: relative;
        }

        .settings-trigger {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 0;
            background: transparent;
            color: #111827;
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .settings-trigger .icon {
            transition: transform 0.18s ease;
        }

        .publish-settings.is-open .settings-trigger .icon {
            transform: rotate(180deg);
        }

        .bottom-spacer {
            flex: 1;
        }

        .footer-btn {
            height: 50px;
            min-width: 145px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 7px;
            border: 1px solid var(--line-strong);
            background: #fff;
            color: #111827;
            font-size: 18px;
            font-weight: 700;
            transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
        }

        .footer-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f8fbff;
        }

        .footer-btn--primary {
            min-width: 120px;
            border-color: var(--brand);
            color: #fff;
            background: var(--brand);
        }

        .footer-btn--primary:hover {
            border-color: var(--brand-dark);
            background: var(--brand-dark);
            color: #fff;
        }

        .settings-popover {
            position: absolute;
            left: -80px;
            bottom: 56px;
            width: 520px;
            padding: 22px;
            border-radius: 10px;
            background: #fff;
            box-shadow: var(--shadow-lg);
            border: 1px solid #eef1f5;
            transform: translateY(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .publish-settings.is-open .settings-popover {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .settings-popover__title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #1a2a3a;
        }

        .settings-popover__status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 16px;
            background: #eaf5f1;
            color: var(--green);
            font-size: 13px;
            font-weight: 500;
        }

        .setting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .setting-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-field--full {
            grid-column: 1 / -1;
        }

        .setting-label {
            color: #4a5a6a;
            font-size: 13px;
            font-weight: 600;
        }

        .field-control {
            height: 40px;
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            background: #fff;
            color: #1a2a3a;
            padding: 0 12px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .field-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.10);
        }

        .tag-row,
        .type-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            min-height: 34px;
            padding: 7px 12px;
            border: 1px solid var(--line-strong);
            border-radius: 18px;
            background: #fff;
            color: #4a5a6a;
            font-size: 13px;
            transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
        }

        .chip.is-selected {
            border-color: var(--primary);
            background: #eef3ff;
            color: var(--primary);
        }

        .settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .mini-btn {
            height: 36px;
            padding: 0 16px;
            border-radius: 7px;
            border: 1px solid var(--line-strong);
            background: #fff;
            color: #1a2a3a;
            font-weight: 600;
        }

        .mini-btn--primary {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .feedback-tab {
            position: fixed;
            right: 0;
            top: 64%;
            z-index: 25;
            width: 42px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ffd3c5;
            border-right: 0;
            border-radius: 9px 0 0 9px;
            background: #fff8f5;
            color: var(--brand);
            font-weight: 700;
            writing-mode: vertical-rl;
            letter-spacing: 0;
        }

        .publish-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(17, 24, 39, 0.38);
            padding: 24px;
        }

        .publish-modal.is-open {
            display: flex;
        }

        .publish-dialog {
            width: min(620px, 100%);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 22px 68px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        .publish-dialog__header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            border-bottom: 1px solid var(--line);
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #4a5a6a;
        }

        .close-btn:hover {
            background: var(--soft);
        }

        .publish-dialog__body {
            padding: 22px;
        }

        .publish-summary {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfd;
        }

        .publish-summary__title {
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #1a2a3a;
        }

        .publish-summary__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: #6b7a8a;
            font-size: 13px;
        }

        .summary-pill {
            display: inline-flex;
            align-items: center;
            height: 26px;
            padding: 0 10px;
            border-radius: 13px;
            background: #eef3ff;
            color: var(--primary);
        }

        .publish-checklist {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .check-item {
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f8f9fa;
            color: #4a5a6a;
            font-size: 14px;
        }

        .check-item .icon {
            color: var(--green);
        }

        .publish-dialog__footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 18px 22px;
            border-top: 1px solid var(--line);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 96px;
            z-index: 60;
            min-width: 180px;
            padding: 11px 18px;
            border-radius: 8px;
            background: rgba(26, 42, 58, 0.92);
            color: #fff;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transform: translate(-50%, 10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.is-show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 1280px) {
            body {
                padding-left: 18px;
                padding-right: 18px;
            }

            .workspace {
                grid-template-columns: 260px minmax(560px, 1fr) 118px;
                gap: 24px;
            }

            .editor-paper {
                padding: 36px 48px 78px;
            }
        }

        @media (max-width: 980px) {
            body {
                padding-top: 116px;
                padding-bottom: 118px;
            }

            .topbar {
                padding: 0 16px;
            }

            .logo {
                font-size: 26px;
            }

            .page-title {
                font-size: 18px;
            }

            .sync-pill {
                display: none;
            }

            .toolbar {
                top: 60px;
                height: 56px;
            }

            .toolbar__scroll {
                padding: 0 12px;
            }

            .tool-btn {
                width: 44px;
                height: 48px;
                font-size: 12px;
            }

            .workspace {
                display: block;
                margin-top: 24px;
            }

            .catalog-panel,
            .ai-panel {
                position: static;
                width: 100%;
                min-height: auto;
                margin-bottom: 16px;
            }

            .ai-panel__body {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .editor-paper {
                min-height: 620px;
                padding: 28px 22px 72px;
            }

            .title-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .title-helper {
                justify-content: flex-start;
            }

            .bottom-bar {
                height: auto;
                min-height: 92px;

    <script>
        const titleEditor = document.getElementById("titleEditor");
        const articleEditor = document.getElementById("articleEditor");
        const editorHints = document.getElementById("editorHints");
        const wordCount = document.getElementById("wordCount");
        const titleRemain = document.getElementById("titleRemain");
        const outlineList = document.getElementById("outlineList");
        const outlineEmpty = document.getElementById("outlineEmpty");
        const publishSettings = document.getElementById("publishSettings");
        const settingsTrigger = document.getElementById("settingsTrigger");
        const settingsClose = document.getElementById("settingsClose");
        const settingsDone = document.getElementById("settingsDone");
        const publishModal = document.getElementById("publishModal");
        const publishBtn = document.getElementById("publishBtn");
        const modalClose = document.getElementById("modalClose");
        const modalCancel = document.getElementById("modalCancel");
        const modalPublish = document.getElementById("modalPublish");
        const saveDraft = document.getElementById("saveDraft");
        const scheduleBtn = document.getElementById("scheduleBtn");
        const toast = document.getElementById("toast");
        const summaryTitle = document.getElementById("summaryTitle");
        const summaryWords = document.getElementById("summaryWords");

        function plainLength(text) {
            return text.replace(/\s/g, "").length;
        }

        function getArticleLength() {
            return plainLength(articleEditor.innerText || "");
        }

        function updateStats() {
            const bodyLength = getArticleLength();
            const titleLength = plainLength(titleEditor.innerText || "");
            wordCount.textContent = `共 ${bodyLength} 字`;
            titleRemain.classList.remove("is-ready", "is-warning");

            if (titleLength < 5) {
                titleRemain.textContent = `还需输入${5 - titleLength}个字`;
            } else if (titleLength > 100) {
                titleRemain.textContent = `已超出${titleLength - 100}个字`;
                titleRemain.classList.add("is-warning");
            } else {
                titleRemain.textContent = "标题可用";
                titleRemain.classList.add("is-ready");
            }

            editorHints.classList.toggle("is-hidden", bodyLength > 0);
            buildOutline();
        }

        function buildOutline() {
            const headings = articleEditor.querySelectorAll("h2, h3");
            outlineList.innerHTML = "";
            outlineEmpty.style.display = headings.length ? "none" : "flex";

            headings.forEach((heading, index) => {
                const text = heading.innerText.trim();
                if (!text) return;
                if (!heading.id) heading.id = `heading-${index + 1}`;
                const item = document.createElement("button");
                item.type = "button";
                item.className = `outline-item level-${heading.tagName === "H3" ? "3" : "2"}`;
                item.textContent = text;
                item.addEventListener("click", () => heading.scrollIntoView({ behavior: "smooth", block: "center" }));
                outlineList.appendChild(item);
            });
        }

        function focusEditor() {
            articleEditor.focus();
            const range = document.createRange();
            range.selectNodeContents(articleEditor);
            range.collapse(false);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function insertHtml(html) {
            focusEditor();
            document.execCommand("insertHTML", false, html);
            updateStats();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("is-show");
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => toast.classList.remove("is-show"), 1800);
        }

        function openPublishModal() {
            const title = titleEditor.innerText.trim();
            summaryTitle.textContent = title || "未填写标题";
            summaryWords.textContent = `${getArticleLength()} 字`;
            publishModal.classList.add("is-open");
        }

        function closePublishModal() {
            publishModal.classList.remove("is-open");
        }

        document.querySelectorAll(".tool-btn").forEach((button) => {
            button.addEventListener("click", () => {
                const command = button.dataset.command;
                const block = button.dataset.block;
                const insert = button.dataset.insert;

                if (command) {
                    focusEditor();
                    document.execCommand(command, false, null);
                }

                if (block === "h2") insertHtml("<h2>新的章节标题</h2><p>在这里展开你的观点。</p>");
                if (block === "blockquote") insertHtml("<blockquote>这里是一段引用内容，可以放结论、来源或关键提醒。</blockquote>");
                if (insert === "code") insertHtml("<pre><code>function publishArticle() {\n  return \"hello CSDN\";\n}</code></pre><p><br></p>");
                if (insert === "table") insertHtml("<p>| 阶段 | 内容 | 状态 |</p><p>| 需求 | 梳理编辑与发布流程 | 已完成 |</p>");
                if (insert === "image") insertHtml("<p>[图片占位] 上传封面或正文配图后将显示在这里。</p>");
                if (insert === "link") insertHtml('<p><a href="#">参考链接标题</a></p>');

                if (button.id === "mdSwitch") {
                    button.classList.toggle("is-active");
                    showToast(button.classList.contains("is-active") ? "已切换为 MD 编辑器视图" : "已切换为富文本编辑视图");
                }

                updateStats();
            });
        });

        document.querySelectorAll(".ai-action").forEach((button) => {
            button.addEventListener("click", () => {
                const type = button.dataset.ai;
                if (type === "outline") {
                    insertHtml("<h2>一、问题背景</h2><p>说明你遇到的业务场景、技术挑战和目标。</p><h2>二、解决思路</h2><p>拆解关键方案，补充架构、流程或代码片段。</p><h2>三、实践总结</h2><p>沉淀经验、边界条件和后续优化方向。</p>");
                    showToast("已生成文章大纲");
                }
                if (type === "code") {
                    insertHtml("<pre><code>const editorState = {\n  title: \"文章标题\",\n  status: \"draft\",\n  tags: [\"前端\", \"工程化\"]\n};</code></pre><p>这段代码可以替换为你的真实示例。</p>");
                    showToast("已插入代码示例");
                }
                if (type === "search") {
                    insertHtml("<blockquote>学术搜索结果占位：可在这里引用论文、标准文档或权威资料。</blockquote>");
                    showToast("已插入资料引用占位");
                }
            });
        });

        document.querySelectorAll(".chip").forEach((chip) => {
            chip.addEventListener("click", () => chip.classList.toggle("is-selected"));
        });

        titleEditor.addEventListener("input", updateStats);
        articleEditor.addEventListener("input", updateStats);
        articleEditor.addEventListener("focus", () => editorHints.classList.add("is-hidden"));
        articleEditor.addEventListener("blur", updateStats);

        document.getElementById("titleMagic").addEventListener("click", () => {
            if (!titleEditor.innerText.trim()) {
                titleEditor.innerText = "从项目实践到技术沉淀：一次完整的开发复盘";
            } else {
                titleEditor.innerText = `${titleEditor.innerText.trim()}：实践经验与复盘`;
            }
            updateStats();
            showToast("已优化标题");
        });

        settingsTrigger.addEventListener("click", () => {
            publishSettings.classList.toggle("is-open");
        });

        settingsClose.addEventListener("click", () => {
            publishSettings.classList.remove("is-open");
        });

        settingsDone.addEventListener("click", () => {
            publishSettings.classList.remove("is-open");
            showToast("发布设置已保存");
        });

        saveDraft.addEventListener("click", () => {
            showToast("草稿已保存到云端");
        });

        scheduleBtn.addEventListener("click", () => {
            publishSettings.classList.add("is-open");
            showToast("可在发布设置中选择定时策略");
        });

        publishBtn.addEventListener("click", openPublishModal);
        modalClose.addEventListener("click", closePublishModal);
        modalCancel.addEventListener("click", closePublishModal);
        modalPublish.addEventListener("click", () => {
            closePublishModal();
            showToast("发布成功，等待内容审核");
        });

        publishModal.addEventListener("click", (event) => {
            if (event.target === publishModal) closePublishModal();
        });

        document.addEventListener("click", (event) => {
            if (!publishSettings.contains(event.target) && event.target !== settingsTrigger) {
                publishSettings.classList.remove("is-open");
            }
        });

        updateStats();
    </script>
</body>
</html>
